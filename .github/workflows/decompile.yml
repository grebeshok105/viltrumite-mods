name: Decompile (one-shot)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing sources (FORCE=1)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decompile + remap to official names
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python3 tools/decompile.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          touch settings.gradle
          gradle wrapper --gradle-version 8.8 --no-daemon
          cp -r gradlew gradlew.bat gradle "$GITHUB_WORKSPACE/"

      - name: Compile check
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Add compile result to report
        if: always()
        run: |
          {
            echo
            echo "## Compile check"
            echo
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "✅ \`./gradlew build\` passed"
            else
              echo "❌ \`./gradlew build\` failed"
              echo
              echo '```'
              grep -E "error:" -A3 build.log | head -400 || true
              grep -A25 "What went wrong" build.log | head -60 || true
              echo '```'
            fi
          } >> DECOMPILE_REPORT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A viltrumiteflight viltrumitecore gradle gradlew gradlew.bat DECOMPILE_REPORT.md
          git update-index --chmod=+x gradlew
          git commit -m "Decompiled sources from original jars" || echo "nothing to commit"
          git push