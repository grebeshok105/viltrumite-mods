name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            viltrumiteflight/build/libs/*.jar
            viltrumitecore/build/libs/*.jar

      - name: Publish v1.13.0-regulus
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.13.0]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Regulus — релиз после мержа PR #3.

          Что вошло:
          - полноценный Regulus как отдельная раса;
          - ручное назначение сердец и вся система heart carriers;
          - Lion's Heart, Debris Kick, Mania, Greed's Embrace, Counter и Evangelium;
          - переработанные анимации от третьего и первого лица;
          - VFX, HUD, скин Regulus и отдельный madness-скин;
          - обновлённая дизайн-спека Regulus.

          Установка: положить оба JAR в `mods/` вместе. Forge 1.20.1.

          Сборка соответствует merged PR #3: 84826c1bd4f5ba0d5c01274897b2fec431dc65fa.
          EOF

          gh release create v1.13.0-regulus \
            viltrumitecore/build/libs/viltrumitecore-forge-1.13.0.jar \
            viltrumiteflight/build/libs/viltrumiteflight-forge-1.8.0.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target 84826c1bd4f5ba0d5c01274897b2fec431dc65fa \
            --title "Regulus — viltrumitecore 1.13.0 + viltrumiteflight 1.8.0" \
            --prerelease \
            --notes-file release-notes.md
